name: CI/CD

# Flujo completo:
#
#   PR:    lint-test ─┐
#          security ──┼─► e2e-k3s (imagen + Trivy + despliegue en k3s + helm test)
#          helm ──────┘   build (multi-arch, sin push) + smoke test arm64
#
#   main:  lint-test, security, helm ─► build (push multi-arch + SBOM + firma Cosign)
#                                         └─► gitops (actualiza values-homelab.yaml -> ArgoCD despliega)
#
#   tag v*: igual que main, publica la imagen versionada (sin tocar GitOps)
#
# Todas las actions están fijadas por SHA de commit y Trivy por digest
# (protección frente a tags comprometidos: ataque a la cadena de suministro).

on:
  push:
    branches: [main]
    tags: ["v*"]
    # El commit del bot de GitOps solo cambia este archivo: no debe volver a lanzar el
    # pipeline (evita un bucle). Los filtros de rutas no se aplican a los tags.
    paths-ignore:
      - chart/demo-api/values-homelab.yaml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # La app que viaja por el pipeline se publica como ghcr.io/<owner>/demo-api
  IMAGE: ghcr.io/${{ github.repository_owner }}/demo-api
  PLATFORMS: linux/amd64,linux/arm64
  K3D_VERSION: v5.9.0
  KUBECONFORM_VERSION: v0.8.0
  # Imagen oficial de Trivy fijada por digest (inmutable)
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  TRIVY_GATE: --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

jobs:
  # ---------------------------------------------------------------- CI: código
  lint-test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  # ------------------------------------------------------ CI: seguridad (SAST)
  security:
    name: Seguridad (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publicar resultados en la pestaña Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Informe completo -> pestaña "Security > Code scanning" de GitHub
      - name: Trivy (informe SARIF)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" \
            fs --scanners vuln,secret,misconfig --format sarif --output trivy-fs.sarif .

      - name: Publicar en GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Puerta de calidad: falla si hay vulnerabilidades, secretos o
      # malas configuraciones (Dockerfile, Helm) HIGH/CRITICAL con solución disponible
      - name: Trivy (puerta de calidad)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" \
            fs --scanners vuln,secret,misconfig $TRIVY_GATE .

  # ---------------------------------------------------- CI: chart de Kubernetes
  helm:
    name: Validar Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Instalar kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: helm lint
        run: |
          helm lint chart/demo-api --strict
          helm lint chart/demo-api --strict -f chart/demo-api/values-homelab.yaml

      - name: Validar manifiestos contra el esquema de Kubernetes
        run: |
          for values in values.yaml values-homelab.yaml; do
            echo "== $values"
            helm template t chart/demo-api -f "chart/demo-api/$values" \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.32.0
          done

  # ---------------------------------------- CI: prueba real en Kubernetes (k3s)
  e2e-k3s:
    name: E2E en k3s (k3d)
    if: github.event_name == 'pull_request'
    needs: [lint-test, security, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Fecha (refresca la capa de parches del sistema cada día)
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build de la imagen (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: demo-api:ci
          build-args: |
            APP_VERSION=pr-${{ github.event.number }}
            APT_CACHE_BUST=${{ steps.date.outputs.day }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (escaneo de la imagen)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image $TRIVY_GATE demo-api:ci

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Crear clúster k3s de 3 nodos (k3d)
        run: |
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG="$K3D_VERSION" bash
          k3d cluster create ci --agents 2 --wait --timeout 180s
          kubectl get nodes -o wide

      - name: Desplegar con Helm
        run: |
          k3d image import demo-api:ci -c ci
          helm install demo-api chart/demo-api \
            --namespace demo-api --create-namespace \
            --set image.repository=demo-api \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set replicaCount=3 \
            --wait --timeout 3m
          kubectl -n demo-api get pods -o wide

      - name: helm test (health, info, metrics desde dentro del clúster)
        run: helm test demo-api -n demo-api --logs

      # Un pod hace peticiones sin parar al Service durante 60 s mientras se reemplazan
      # todas las réplicas. Si falla una sola petición, el job falla: demuestra el apagado limpio.
      - name: Rolling update sin caída (con tráfico continuo)
        run: |
          kubectl -n demo-api run load --image=curlimages/curl:8.11.1 --restart=Never --command -- sh -c '
            ok=0; fail=0; end=$(( $(date +%s) + 60 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              if curl -fs -m 2 http://demo-api/health >/dev/null; then ok=$((ok+1)); else fail=$((fail+1)); fi
              sleep 0.1
            done
            echo "peticiones correctas=$ok fallidas=$fail"
            [ "$fail" -eq 0 ]'
          kubectl -n demo-api wait --for=condition=Ready pod/load --timeout=60s
          helm upgrade demo-api chart/demo-api -n demo-api --reuse-values \
            --set podAnnotations.rollout="$GITHUB_RUN_ID" --wait --timeout 3m
          kubectl -n demo-api rollout status deploy/demo-api
          kubectl -n demo-api get pods -o wide
          kubectl -n demo-api wait --for=jsonpath='{.status.phase}'=Succeeded pod/load --timeout=120s \
            || { kubectl -n demo-api logs load; exit 1; }
          kubectl -n demo-api logs load

      - name: Diagnóstico si algo falla
        if: failure()
        run: |
          kubectl get all -A
          kubectl -n demo-api describe pods
          kubectl -n demo-api logs -l app.kubernetes.io/name=demo-api --tail=50

  # ------------------------------------------------------ CD: imagen publicada
  build:
    name: Build multi-arch, SBOM y firma
    needs: [lint-test, security, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar en GHCR
      id-token: write # firma keyless con Cosign (OIDC de GitHub)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Las referencias de imagen deben ir en minúsculas (el usuario "EA-etn" tiene mayúsculas)
      - name: Normalizar nombre de la imagen
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      # QEMU emula ARM en el runner x86 de GitHub
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Fecha (refresca la capa de parches del sistema cada día)
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build multi-arquitectura (push + SBOM + provenance si no es PR)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APT_CACHE_BUST=${{ steps.date.outputs.day }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # En PR: la imagen arm64 arranca (emulada) => funcionará en una Raspberry Pi
      - name: Smoke test arm64
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/arm64 --load --cache-from type=gha \
            --build-arg APT_CACHE_BUST="${{ steps.date.outputs.day }}" -t demo-api:arm64 .
          docker run -d --name api --platform linux/arm64 -p 8000:8000 demo-api:arm64
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          echo; docker exec api uname -m
          curl -fs localhost:8000/health || { docker logs api; exit 1; }

      - name: Trivy (escaneo de la imagen publicada)
        if: github.event_name != 'pull_request'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" \
            image $TRIVY_GATE "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      # Firma "keyless": sin claves que guardar; la identidad es este workflow
      - name: Firmar la imagen con Cosign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  # ----------------------------------------------------------- CD: GitOps
  gitops:
    name: GitOps (actualizar homelab)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # main está protegida por un ruleset: el bot empuja con una deploy key que figura
      # en la lista de excepciones (bypass) del ruleset. GITHUB_TOKEN no puede saltárselo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      # ArgoCD vigila Git, no el registro: escribimos en Git la versión exacta a desplegar
      # Sin "[skip ci]": impediría que un tag/release creado sobre este commit ejecute el pipeline.
      # El bucle se evita con paths-ignore (ver "on:").
      - name: Actualizar image.tag en values-homelab.yaml
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s|^(  tag:).*|\1 ${TAG}|" chart/demo-api/values-homelab.yaml
          git diff
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(gitops): desplegar ${TAG} en homelab"
          git pull --rebase origin main
          git push origin HEAD:main
