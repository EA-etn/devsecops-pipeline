# Valores por defecto del chart. Cada entorno sobrescribe lo que necesite
# (ver values-homelab.yaml).

replicaCount: 2

image:
  repository: ghcr.io/ea-etn/demo-api
  # Vacío = usa appVersion del Chart.yaml
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # La app no habla con la API de Kubernetes: no necesita token
  automount: false

podAnnotations: {}
podLabels: {}

# Seguridad del pod (cumple el perfil "restricted" de Pod Security Standards)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: demo-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 2

# Apagado limpio: antes de enviar SIGTERM, el pod espera unos segundos para que el
# Service y el Ingress dejen de mandarle tráfico (evita errores durante un rolling update).
lifecycle:
  preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Reparte las réplicas entre nodos distintos (p. ej. Raspberry Pi y PC)
topologySpread:
  enabled: true
  maxSkew: 1
  # ScheduleAnyway: preferencia (el planificador puede ignorarla).
  # DoNotSchedule: obligatorio; combínalo con nodeTaintsPolicy: Honor para que un nodo caído
  # no bloquee los pods nuevos.
  whenUnsatisfiable: ScheduleAnyway
  # Vacío = comportamiento por defecto de Kubernetes (Ignore). Opciones: Honor, Ignore
  nodeTaintsPolicy: ""

# Requiere el CRD de Prometheus Operator (kube-prometheus-stack)
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
