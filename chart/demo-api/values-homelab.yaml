# Valores del entorno homelab (k3s en Raspberry Pi + PC).
# ArgoCD despliega el chart con estos valores.
# El pipeline de CI actualiza image.tag automáticamente tras cada merge a main.

image:
  tag: sha-3e8365c

replicaCount: 2

ingress:
  enabled: true
  className: traefik # Ingress controller incluido en k3s
  hosts:
    - host: demo-api.home.arpa
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

# Una réplica en cada nodo (Pi y PC); si un nodo cae, no cuenta y los pods van al otro
topologySpread:
  whenUnsatisfiable: DoNotSchedule
  nodeTaintsPolicy: Honor

# Prometheus (kube-prometheus-stack en el homelab) recoge /metrics con este ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 30s
